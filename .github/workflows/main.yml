name: Release Creation

on: 
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    # Zip the module content, excluding unwanted files
    - name: Zip Module
      run: |
        zip -r module.zip . -x ".git/*" ".github/*" ".gitignore" "LICENSE" "README.md" "node_modules/*"

    # Create a GitHub Release
    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        name: ${{ github.ref_name }}
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: "module.json,module.zip"
        tag: ${{ github.ref_name }}
        body: "Release ${{ github.ref_name }}"
